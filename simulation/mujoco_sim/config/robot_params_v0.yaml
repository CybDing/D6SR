# =============================================================================
# ROBOT V0 PHYSICS CONFIGURATION (single-body shell)
# =============================================================================

simulation:
  timestep: 0.001
  gravity: [0, 0, -9.81]
  initial_height: 0.3

solver:
  iterations: 100
  tolerance: 1e-6
  solver: Newton
  integrator: implicitfast
  cone: elliptic

ground:
  position: [0, 0, -0.5]
  friction: [1.0, 0.02, 0.001]
  condim: 6
  solref: [0.02, 1]
  solimp: [0.9, 0.95, 0.01]
  rgba: [0.92, 0.90, 0.86, 1.0]

joints:
  default:
    damping: 0.0005
    frictionloss: 0.0002
    armature: 0.0003

outer_shell:
  friction: [1.0, 0.02, 0.001]
  condim: 6
  solref: [0.02, 1]
  solimp: [0.9, 0.95, 0.01]

visual:
  base_link: [0.30, 0.35, 0.85, 0.95]

ballast:
  enabled: false

contact:
  internal_bodies: []
  outer_body: base_link
